[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voynich-lab"
version = "0.1.0"
description = "Reproducible Voynich-only language modeling and causal interpretation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=2,<3",
    "unidecode>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
historical-vision = [
    "transformers==4.48.3",
    "pillow==11.3.0",
    "safetensors==0.8.0",
]
boundary-vision = [
    "opencv-python-headless>=5,<6",
    "pandas>=3,<4",
    "pillow>=11,<12",
]

[project.scripts]
voynich-train = "voynich.train:main"
voynich-evaluate = "voynich.evaluate:main"
voynich-interpret = "voynich.interpret:main"
voynich-worlds = "voynich.communication.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voynich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
