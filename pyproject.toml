[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voynich-lab"
version = "0.1.0"
description = "Reproducible Voynich-only language modeling and causal interpretation"
requires-python = ">=3.12,<3.15"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
voynich-train = "voynich.train:main"
voynich-evaluate = "voynich.evaluate:main"
voynich-interpret = "voynich.interpret:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voynich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
